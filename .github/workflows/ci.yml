name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the CLI
        run: |
          pip install .
          nightwatch rules
          nightwatch scan samples --year 2026 --format html --output report.html

  demo-report:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m nightwatch scan samples --year 2026 --format html --output nightwatch-report.html
      - uses: actions/upload-artifact@v4
        with:
          name: nightwatch-sample-report
          path: nightwatch-report.html
